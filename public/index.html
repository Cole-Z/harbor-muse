<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:16px/1.35 system-ui,-apple-system,sans-serif;color:#111;background:#eef2f5}
#map{position:fixed;inset:0}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 18px #0004;padding:14px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(110%);transition:transform .2s;min-height:35vh}
#sheet.open{transform:none}
#sheet h2{margin:4px 40px 10px 0;font-size:22px}
#sPhoto{margin:8px 0 4px}#sPhoto[hidden]{display:none!important}#sPhoto img{display:block;width:100%;height:72px;object-fit:cover;border-radius:10px;background:#dde5ec}#sPhoto figcaption{font-size:11px;line-height:1.3;color:#555;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(min-width:768px){#sPhoto img{height:96px}}#sPhoto a{color:inherit}

#close{position:absolute;right:10px;top:8px;width:44px;height:44px;border:0;background:#eee;border-radius:50%;font-size:22px}

.ship{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ship img{width:20px;height:20px;filter:drop-shadow(0 1px 1.5px #000a);transition:width .15s,height .15s;pointer-events:none}
.ship.moored img{opacity:.55}.ship.stale img{opacity:.3}

#lookBtn[aria-pressed=true]{background:#0e7490;color:#fff}
[data-theme=night] #lookBtn[aria-pressed=false]{background:#1f2937;color:#e5e7eb}
body.ask-open #lookBtn,body.card-open #lookBtn{display:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);z-index:9;background:#111c;color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;display:none}
.ship.sel img{width:25px;height:25px;opacity:1;border-radius:50%;box-shadow:0 0 0 2px #F8FAFC,0 0 0 3.5px #0F172A}
#askBtn{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 34px);z-index:5;border:0;border-radius:999px;padding:12px 18px;background:#1d4ed8;color:#fff;font-weight:700;box-shadow:0 2px 8px #0004}
body.ask-open #askBtn,body.card-open #askBtn{display:none}
#askPanel{position:fixed;z-index:7;background:#fff;display:none;flex-direction:column;min-height:0;color:#0b1220}
#askPanel.open{display:flex}
#askHead{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-bottom:8px}
#askSel{flex:1;margin:0;font-size:15px;color:#333;font-weight:600}
#askX{border:0;background:#eee;border-radius:50%;width:32px;height:32px;flex-shrink:0}
#askLog{flex:1;overflow-y:auto;min-height:64px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
#askLog:empty{display:none}

#askLog .ans{align-self:flex-start;max-width:92%;margin:0;background:#f1f5f9;color:#0b1220;border:1px solid #cbd5e1;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:17px;line-height:1.5;word-wrap:break-word}

#tellMore{margin:12px 8px 0 0;border:0;border-radius:999px;padding:10px 14px;background:#1d4ed8;color:#fff;font-weight:700}#tellMore:disabled{opacity:.55}
#askLog .src{display:block;margin-top:8px;font-size:13px;opacity:.85}#askLog .src a{color:inherit}
#askAbout{margin-top:12px;border:0;border-radius:999px;padding:10px 14px;background:#eef2f5;color:#124;font-weight:700}
@media (max-width:767px){
  #askPanel.open{left:8px;right:8px;top:calc(env(safe-area-inset-top) + 56px);height:min(48vh,420px);border-radius:16px;box-shadow:0 8px 28px #0004;padding:12px}

  body.ask-open #map,body.ask-open #sheet,body.ask-open #top,body.ask-open #note,body.ask-open #credits,body.ask-open #lookBtn,body.ask-open #toast{visibility:hidden}
  body.ask-open #askPanel.open{left:0;right:0;top:var(--vvt,0px);bottom:auto;height:var(--vvh,100dvh);border-radius:0;box-shadow:none;padding:calc(env(safe-area-inset-top) + 6px) 8px 8px}
  body.ask-open #askHead{margin-bottom:6px;min-height:36px}
  body.ask-open #askSel{font-size:11px;font-weight:500;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.ask-open #askLog{gap:6px;min-height:0}
  body.ask-open #askLog .me,body.ask-open #askLog .ans,body.ask-open #askLog .err{max-width:92%;font-size:14px;line-height:1.35;padding:8px 10px;border-radius:12px}
  body.ask-open #askLog .wait{padding:4px 10px;font-size:13px}
  body.ask-open #askLog .conf,body.ask-open #askLog .src{font-size:11px;margin-top:4px}
  body.ask-open #askLog .askShow{font-size:13px;padding:6px 10px;margin-top:6px}
  body.ask-open #askForm{padding-top:6px;padding-bottom:env(safe-area-inset-bottom)}
  body.ask-open #askQ{font-size:16px;padding:8px 10px}
  body.ask-open #askForm button{padding:8px 12px}
}
#askChip{display:none;align-items:center;gap:6px;max-width:60%;border:0;border-radius:999px;background:#eef2f5;color:#124;font-weight:600;font-size:13px;padding:4px 10px 4px 6px;flex-shrink:1;min-width:0}
#askChip img{width:20px;height:20px;flex-shrink:0}#askChip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:767px){body.ask-open #askChip.on{display:inline-flex}}
html[data-theme=night] #askChip{background:#1f2937;color:#e2e8f0}
@media (min-width:768px){
  #askPanel.open{top:0;right:0;bottom:0;width:min(400px,42vw);border-radius:0;box-shadow:-4px 0 18px #0003;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
  body.ask-open #map,body.ask-open #credits,body.ask-open #sheet,body.ask-open #note{right:min(400px,42vw)}
  body.ask-open #top{right:calc(min(400px,42vw) + 10px)}
}
html[data-theme=night] #askPanel{background:#111827;color:#f1f5f9}html[data-theme=night] #askSel{color:#cbd5e1}
html[data-theme=night] #askQ{background:#1f2937;color:#f9fafb;border-color:#4b5563}html[data-theme=night] #askX{background:#374151;color:#f9fafb}
html[data-theme=night] #askForm{background:#111827}
html[data-theme=night] #askLog .ans{background:#1e293b;color:#f9fafb;border-color:#475569}
html[data-theme=night] #askLog .conf{background:#334155;color:#f1f5f9}html[data-theme=night] #askLog .conf.high{background:#14532d}html[data-theme=night] #askLog .conf.low{background:#78350f}
html[data-theme=night] #askLog .err{background:#450a0a;border-color:#991b1b;color:#fecaca}
html[data-theme=night] #sheet{background:#111827;color:#f1f5f9}html[data-theme=night] #sheet dt{color:#94a3b8}
html[data-theme=night] #close{background:#374151;color:#f9fafb}html[data-theme=night] #askAbout{background:#1f2937;color:#e2e8f0}
html[data-theme=night] #sPhoto figcaption{color:#94a3b8}
html[data-theme=night] #credits{background:rgba(20,24,30,.8);color:#ccd}html[data-theme=night] #credits a{color:#9cf}
#sFlag{margin:-6px 0 6px 36px;font-size:13px;opacity:.8}
</style></head><body>
<div id="map"></div>
<div id="top"><span class="pill" id="title">Harbor Muse</span><span class="pill" id="count">0 ships</span><span class="pill" id="badge">…</span></div>

<div id="credits"><a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> · AIS data via <a href="https://aisstream.io" target="_blank">aisstream.io</a></div>
<div id="sheet" role="dialog" aria-label="Ship details"><button id="close" aria-label="Close">×</button><h2 id="sName"><img id="sIcon" alt="" width="28" height="28" style="vertical-align:-5px;margin-right:8px" onerror="if(!this.src.endsWith('/unknown.svg'))this.src='/assets/ship-types/unknown.svg'"><span id="sNameT"></span></h2><div id="sFlag" hidden></div>
<dl><dt>Type</dt><dd id="sType"></dd><dt>Speed</dt><dd id="sSog"></dd><dt>Heading</dt><dd id="sHdg"></dd><dt>Destination</dt><dd id="sDest"></dd><dt>Updated</dt><dd id="sAge"></dd></dl><p id="sExtra" hidden></p><figure id="sPhoto" hidden><img id="sPhotoImg" alt="" decoding="async"><figcaption id="sPhotoCap"></figcaption></figure><button id="tellMore" type="button">Tell me more</button><button id="askAbout" type="button">Ask Muse about this</button></div>
<button id="lookBtn" type="button" aria-pressed="false" aria-label="Looking at" title="Looking at"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg></button><div id="toast" role="status"></div>
<button id="askBtn" type="button">Ask Muse</button>
<div id="askPanel" role="dialog" aria-label="Ask Muse"><div id="askHead"><button id="askChip" type="button" aria-label="Show ship card"><img id="askChipIcon" alt="" width="20" height="20"><span id="askChipName"></span></button><p id="askSel"></p><button id="askX" aria-label="Close" type="button">×</button></div>

<script>
const CENTER=[-97.30,27.78], ZOOM=10, FIT_MAX=12.5, FIT_PAD=48, POLL=5000; // CENTER = Corpus Christi demo home, used only without geolocation
let here=null, lastSent=null;
const VID=sessionStorage.vid||(sessionStorage.vid=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)));
const km=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;return 2*R*Math.asin(Math.sqrt(Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2))};
function sendView(force){if(!here)return;if(!force&&lastSent&&km(here,lastSent)<2)return;lastSent={...here};
 fetch('/view',{method:'POST',headers:{'Content-Type':'application/json','X-Viewer':VID},body:JSON.stringify(here)}).catch(()=>{})}
function center(){if(!map||!here)return;map.setView?map.setView([here.lat,here.lon],ZOOM):map.jumpTo({center:[here.lon,here.lat],zoom:ZOOM})}
let fitted=false;// fit ships once per view (first load / demo toggle), then leave the user's pan/zoom alone
function fitShips(list){if(fitted||!map)return;const pts=list.filter(s=>isFinite(s.lat)&&isFinite(s.lon));if(!pts.length)return;fitted=true;
 let w=180,e=-180,so=90,n=-90;for(const s of pts){w=Math.min(w,s.lon);e=Math.max(e,s.lon);so=Math.min(so,s.lat);n=Math.max(n,s.lat)}
 if(here&&!demo){w=Math.min(w,here.lon);e=Math.max(e,here.lon);so=Math.min(so,here.lat);n=Math.max(n,here.lat)}
 try{if(map.fitBounds&&window.L&&map instanceof L.Map)map.fitBounds([[so,w],[n,e]],{padding:[FIT_PAD,FIT_PAD],maxZoom:Math.floor(FIT_MAX)});else map.fitBounds([[w,so],[e,n]],{padding:FIT_PAD,maxZoom:FIT_MAX,duration:600})}catch{}}
function locate(){if(!navigator.geolocation)return;const ok=p=>{const first=!here;here={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:Math.round(p.coords.accuracy||0)};
 if(first){refreshTheme();center();fitted=false;sendView(true);poll()}else sendView(false)};
 navigator.geolocation.getCurrentPosition(ok,()=>{},{enableHighAccuracy:false,timeout:8000,maximumAge:60000});
 navigator.geolocation.watchPosition(ok,()=>{},{enableHighAccuracy:false,timeout:30000,maximumAge:60000});
 setInterval(()=>sendView(true),30000)}
const $=id=>document.getElementById(id);
function typeName(t){return ShipType.typeLabel(t)}
const unk=v=>v==null||v===''?'<span class="unk">unknown</span>':String(v).replace(/[<>&]/g,'');
let ships={}, selected=null, map, engine;
// Day/night: viewer-local sunrise/sunset (falls back to CENTER until location is known). Markers are DOM markers, so setStyle keeps them.
let curTheme=null, applyTheme=()=>{};
const STYLES={day:'https://tiles.openfreemap.org/styles/positron',night:'https://tiles.openfreemap.org/styles/dark'};
const styleUrl=t=>STYLES[t];
function theme(){const p=here||{lat:CENTER[1],lon:CENTER[0]};return window.Sun&&!Sun.isDay(new Date(),p.lat,p.lon)?'night':'day'}
function setThemeClass(){document.documentElement.dataset.theme=theme()}
const AIS_CREDIT=' · AIS data via <a href="https://aisstream.io" target="_blank">aisstream.io</a>';
const OSM_CREDIT='© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'+AIS_CREDIT;
const CARTO_CREDIT='© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions" target="_blank">CARTO</a>'+AIS_CREDIT;
function refreshTheme(){setThemeClass();applyTheme()}
setInterval(refreshTheme,12*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshTheme()});
const markers=new Map();
function icon(s){return '<img alt="" draggable="false" src="'+ShipType.markerUrl(s.type)+'">'}
function rot(s){return s.hdg??s.cog??0}
function makeEl(s){const el=document.createElement('div');el.className='ship';el.innerHTML=icon(s);el.setAttribute('role','button');el.setAttribute('aria-label',s.name||('MMSI '+s.mmsi));
 el.addEventListener('click',e=>{e.stopPropagation();openCard(s.mmsi)});return el}
// map engines: MapLibre first, Leaflet + OSM raster fallback
function initMapLibre(){curTheme=theme();setThemeClass();map=new maplibregl.Map({container:'map',style:styleUrl(curTheme),center:CENTER,zoom:ZOOM,attributionControl:false});
 map.on('click',closeCard);applyTheme=()=>{const t=theme();if(t!==curTheme){curTheme=t;map.setStyle(styleUrl(t))}};engine={add(s){const el=makeEl(s);const m=new maplibregl.Marker({element:el,rotationAlignment:'map'}).setLngLat([s.lon,s.lat]).addTo(map);return {m,el}},
 move(k,s){k.m.setLngLat([s.lon,s.lat]);k.m.setRotation(rot(s))},remove(k){k.m.remove()},
 trail(pts){if(!map.isStyleLoaded())return;const data={type:'Feature',geometry:{type:'LineString',coordinates:pts.map(p=>[p.lon,p.lat])}};const src=map.getSource('trail');
  if(src)src.setData(data);else{map.addSource('trail',{type:'geojson',data});map.addLayer({id:'trail',type:'line',source:'trail',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#d00','line-width':2,'line-opacity':.7}})}},
 course(pts){if(!map.isStyleLoaded())return;const data={type:'Feature',geometry:{type:'LineString',coordinates:pts.map(p=>[p.lon,p.lat])}};const src=map.getSource('course');
  if(src)src.setData(data);else{map.addSource('course',{type:'geojson',data});map.addLayer({id:'course',type:'line',source:'course',layout:{'line-cap':'round'},paint:{'line-color':'#0a84ff','line-width':2,'line-dasharray':[2,2],'line-opacity':.9}})}}}}
function initLeaflet(){return new Promise(r=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);
 const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>{map=L.map('map',{attributionControl:false,zoomControl:false}).setView([CENTER[1],CENTER[0]],10);
 let tl;applyTheme=()=>{const t=theme();if(t===curTheme)return;curTheme=t;if(tl)tl.remove();tl=(t==='night'?L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd'}):L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19})).addTo(map);$('credits').innerHTML=t==='night'?CARTO_CREDIT:OSM_CREDIT};applyTheme();map.on('click',closeCard);
 $('credits').innerHTML='© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · AIS data via <a href="https://aisstream.io">aisstream.io</a>';
 engine={add(s){const el=makeEl(s);const m=L.marker([s.lat,s.lon],{icon:L.divIcon({html:el,className:'',iconSize:[30,30]})}).addTo(map);return {m,el}},
 move(k,s){k.m.setLatLng([s.lat,s.lon]);const svg=k.el.querySelector('img');svg.style.transform='rotate('+rot(s)+'deg)'},remove(k){k.m.remove()},
 trail(pts){const ll=pts.map(p=>[p.lat,p.lon]);if(this.line)this.line.setLatLngs(ll);else this.line=L.polyline(ll,{color:'#d00',weight:2,opacity:.7,interactive:false}).addTo(map)},
 course(pts){const ll=pts.map(p=>[p.lat,p.lon]);if(this.cline)this.cline.setLatLngs(ll);else this.cline=L.polyline(ll,{color:'#0a84ff',weight:2,dashArray:'6 6',opacity:.9,interactive:false}).addTo(map)}};r()};document.head.appendChild(s)})}
function render(){for(const [mmsi,k] of markers) if(!ships[mmsi]){engine.remove(k);markers.delete(mmsi)}
 for(const s of Object.values(ships)){let k=markers.get(s.mmsi);if(!k){k=engine.add(s);markers.set(s.mmsi,k)}engine.move(k,s);
  const im=k.el.querySelector('img'),u=ShipType.markerUrl(s.type);if(im&&im.getAttribute('src')!==u)im.setAttribute('src',u);k.el.classList.toggle('moored',s.sog!=null&&s.sog<0.5);k.el.classList.toggle('stale',s.stale);k.el.classList.toggle('sel',s.mmsi===selected);k.el.classList.toggle('cone',s.mmsi!==selected&&lookInCone(s))}
 if(selected&&!ships[selected])closeCard();else if(selected){fillCard(ships[selected]);loadTrail();syncAskMeta();syncTellMore()}
 drawCourse()}
function drawCourse(){if(!engine||!engine.course||!window.Course)return;try{engine.course(selected?Course.stub(ships[selected]):[])}catch{}}
function fillCard(s){$('sNameT').innerHTML=unk(s.name);const fl=MmsiMid.flagOf(s.mmsi),fe=$('sFlag');fe.hidden=!fl;fe.textContent=fl?(fl.flag+' '+fl.country).trim():'';fe.title=fl?'Flag from MMSI MID '+fl.mid:'';const ic=$('sIcon'),k=ShipType.shipKind(s.type);ic.src=ShipType.iconUrl(s.type);ic.alt=k+' vessel';$('sType').innerHTML=unk(typeName(s.type));$('sSog').innerHTML=s.sog==null?unk():s.sog.toFixed(1)+' kn';
 $('sHdg').innerHTML=(s.hdg??s.cog)==null?unk():Math.round(s.hdg??s.cog)+'°';$('sDest').innerHTML=unk(s.dest);$('sAge').textContent=s.ageSec+' s ago'+(s.stale?' (stale)':'');fillExtra(s)}
const NAV=['Under way (engine)','At anchor','Not under command','Restricted maneuverability','Constrained by draught','Moored','Aground','Fishing','Under way (sailing)'];
function aisExtra(s){const e=v=>String(v).replace(/[<>&]/g,''),p=[];if(s.callsign)p.push(e(s.callsign));if(s.imo)p.push('IMO '+e(s.imo));if(s.length&&s.beam)p.push(e(s.length)+'×'+e(s.beam)+' m');if(s.draught)p.push('draught '+e(s.draught)+' m');if(s.navStatus!=null&&NAV[s.navStatus])p.push(NAV[s.navStatus]);if(s.eta)p.push('ETA '+e(s.eta));return p.join(' · ')}
function fillExtra(s){const x=$('sExtra'),t=aisExtra(s);x.textContent=t;x.hidden=!t}
let trailFor=null;
async function loadTrail(){const id=selected;if(!engine||!engine.trail)return;if(!id){trailFor=null;engine.trail([]);return}
 try{const r=await fetch('/ships/'+id+'/trail',{cache:'no-store'});const pts=r.ok?await r.json():[];if(selected!==id)return;
  const s=ships[id];if(s&&pts.length&&(pts[pts.length-1].lat!==s.lat||pts[pts.length-1].lon!==s.lon))pts.push({lat:s.lat,lon:s.lon});
  trailFor=id;engine.trail(pts.length>1?pts:[])}catch{}}
let photoFor=null;
async function loadPhoto(s){const f=$('sPhoto'),im=$('sPhotoImg'),cap=$('sPhotoCap');f.hidden=true;photoFor=s.mmsi;
 try{const r=await fetch('/ship-photo?mmsi='+s.mmsi+'&name='+encodeURIComponent(s.name||'')+'&type='+(s.type||''));if(!r.ok||photoFor!==s.mmsi)return;const p=await r.json();if(!p||!p.url||photoFor!==s.mmsi)return;
  im.onerror=()=>{f.hidden=true;layoutAsk()};im.onload=()=>{if(photoFor===s.mmsi){f.hidden=false;layoutAsk()}};im.alt=p.match==='name'?'Photo of '+(s.name||'vessel'):'Illustrative '+ShipType.shipKind(s.type)+' vessel';
  cap.textContent='';if(p.match==='name'&&/^https:\/\/commons\.wikimedia\.org\//.test(p.url)){const a=document.createElement('a');a.href=p.url;a.target='_blank';a.rel='noopener';a.textContent=p.attribution+(p.license?' · '+p.license:'');cap.appendChild(a)}else cap.textContent='Type photo (not this vessel)';
  const src=p.thumbUrl||p.url;if(im.getAttribute('src')===src&&im.complete&&im.naturalWidth){f.hidden=false;layoutAsk();return}im.src=src}catch{f.hidden=true;layoutAsk()}}
function openCard(mmsi){selected=mmsi;fillCard(ships[mmsi]);syncTellMore();loadPhoto(ships[mmsi]);$('sheet').classList.add('open');document.body.classList.add('card-open');render();loadTrail();syncAskMeta();layoutAsk()}
function closeCard(){selected=null;$('sheet').classList.remove('open');document.body.classList.remove('card-open');render();loadTrail();syncAskMeta();layoutAsk()}
$('close').onclick=closeCard;
let demo=false; // explicit opt-in only; never auto-switched
$('demoBtn').onclick=()=>{demo=!demo;fitted=false;if(demo&&map){map.setView?map.setView([CENTER[1],CENTER[0]],ZOOM):map.jumpTo({center:CENTER,zoom:ZOOM})}else center();poll()};
let polling=false,pollT=null;
function bboxQ(){try{const b=map&&map.getBounds&&map.getBounds();if(!b)return'';return'&bbox='+[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].map(x=>x.toFixed(4)).join(',')}catch{return''}}
function schedule(){clearTimeout(pollT);if(!document.hidden)pollT=setTimeout(poll,POLL)}
// Reconcile-in-place: render() updates/adds/removes markers by MMSI; a failed poll keeps the last markers.
async function poll(){if(document.hidden||polling)return;polling=true;clearTimeout(pollT);
 try{const q=here?'?lat='+here.lat.toFixed(4)+'&lon='+here.lon.toFixed(4)+(demo?'&demo=1':'')+bboxQ():'';const r=await fetch('/ships'+q,{cache:'no-store',headers:{'X-Viewer':VID}});if(!r.ok)throw new Error(r.status);const d=await r.json();if(!d||!Array.isArray(d.ships))throw 0;
 const next={};for(const s of d.ships)next[s.mmsi]=s;ships=next;
 const b=$('badge');b.textContent=d.mode.toUpperCase()+(d.demo?' · Corpus Christi':'');b.className='pill '+d.mode;$('count').textContent=d.ships.length+(d.ships.length===1?' ship':' ships');const n=$('note'),btn=$('demoBtn');$('noteMain').textContent=d.note||'';$('noteDetail').textContent=d.detail||'';btn.textContent=demo?'Back to my location':'Watch Corpus Christi demo (replay)';btn.style.display=(d.demoAvailable||demo)?'inline-block':'none';n.style.display=(d.note||demo)?'block':'none';if(demo&&!d.note)$('noteMain').textContent='Demo: Corpus Christi replay';render();fitShips(d.ships)}
 catch(e){const b=$('badge');b.textContent='Reconnecting…';b.className='pill'}
 finally{polling=false;schedule()}}
function webgl(){try{const c=document.createElement('canvas');return !!(c.getContext('webgl2')||c.getContext('webgl'))}catch{return false}}
function loadMapLibre(){return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
// ---- Ask Muse (typed). Location/heading go with the request only. ----
let askMmsi=null, compass=null, compassAsked=false;
function onOrient(e){const h=e.webkitCompassHeading??(e.absolute&&e.alpha!=null?(360-e.alpha)%360:null);if(h!=null){compass=Math.round(h)%360;compassAt=Date.now();onHeading()}}
function startCompass(){if(compassAsked)return;compassAsked=true;try{const D=window.DeviceOrientationEvent;if(!D)return;
 if(typeof D.requestPermission==='function')D.requestPermission().then(p=>{if(p==='granted')addEventListener('deviceorientation',onOrient)}).catch(()=>{});
 else{addEventListener('deviceorientationabsolute',onOrient);addEventListener('deviceorientation',onOrient)}}catch{}}
function resizeMap(){try{if(!map)return;if(map.resize)map.resize();else if(map.invalidateSize)map.invalidateSize()}catch{}}
function layoutAsk(){const h=document.body.classList.contains('card-open')?$('sheet').offsetHeight:0;document.body.style.setProperty('--sheet-h',h+'px');resizeMap()}
// ---- W2 "Looking at" wedge. Client-only; same cone as /ask ranking (Cone.HALF_DEG / Cone.RANGE_NM). ----
let lookOn=false, compassAt=0, lookShown=false;
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3500)}
function lookOrigin(){if(here)return here;if(!map)return null;const c=map.getCenter();return{lat:c.lat,lon:c.lng}}
function lookLive(){return lookOn&&compass!=null&&Date.now()-compassAt<=Cone.STALE_MS}
function lookInCone(s){return lookLive()&&Cone.inCone(lookOrigin(),compass,s)}
function requestHeading(){return new Promise(res=>{const D=window.DeviceOrientationEvent;if(!D)return res(false);compassAsked=true;
 const listen=()=>{addEventListener('deviceorientationabsolute',onOrient);addEventListener('deviceorientation',onOrient)};
 if(typeof D.requestPermission==='function')D.requestPermission().then(p=>{if(p==='granted'){listen();res(true)}else res(false)}).catch(()=>res(false));
 else{listen();if(compass!=null&&Date.now()-compassAt<2000)return res(true);const t0=Date.now(),iv=setInterval(()=>{if(compassAt>t0){clearInterval(iv);res(true)}else if(Date.now()-t0>3000){clearInterval(iv);res(false)}},100)}})}
function drawWedge(){const live=lookLive(),o=live&&lookOrigin();const ring=o?Cone.wedge(o,compass):null;lookShown=!!ring;if(!map)return;
 if(window.L&&map instanceof L.Map){if(!ring){if(drawWedge.poly){drawWedge.poly.remove();drawWedge.poly=null}return}
  const ll=ring.map(p=>[p[1],p[0]]);if(drawWedge.poly)drawWedge.poly.setLatLngs(ll);else drawWedge.poly=L.polygon(ll,{color:'#22d3ee',weight:1,opacity:.6,fillColor:'#22d3ee',fillOpacity:.14,interactive:false}).addTo(map);return}
 if(!map.isStyleLoaded())return;const data={type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[ring||[]]}};const src=map.getSource('cone');
 if(src)src.setData(ring?data:{type:'FeatureCollection',features:[]});else if(ring){map.addSource('cone',{type:'geojson',data});
  map.addLayer({id:'cone-fill',type:'fill',source:'cone',paint:{'fill-color':'#22d3ee','fill-opacity':.14}});
  map.addLayer({id:'cone-line',type:'line',source:'cone',paint:{'line-color':'#22d3ee','line-width':1,'line-opacity':.6}})}}
function lookUpdate(){drawWedge();for(const [mmsi,k] of markers){const s=ships[mmsi];if(s)k.el.classList.toggle('cone',mmsi!==selected&&lookInCone(s))}}
const onHeading=window.Cone?Cone.throttle(()=>{if(lookOn)lookUpdate()},Cone.THROTTLE_MS):()=>{};
function setLook(on){lookOn=on;$('lookBtn').setAttribute('aria-pressed',String(on));lookUpdate()}
$('lookBtn').onclick=async()=>{if(lookOn)return setLook(false);const ok=await requestHeading();if(!ok){toast('Compass heading not available — Looking at stays off');return setLook(false)}setLook(true)};
// staleness (>5 s without heading), user location / map moves, MapLibre style swaps
setInterval(()=>{if(lookOn&&lookShown!==lookLive())lookUpdate()},1000);
let lookHere=null;setInterval(()=>{if(lookOn&&here&&here!==lookHere){lookHere=here;lookUpdate()}},1000);
(async()=>{try{if(!webgl())throw 0;await loadMapLibre();initMapLibre()}catch{await initLeaflet()}
 if(map&&map.on){map.on('moveend',()=>{if(lookOn&&!here)lookUpdate()});if(!(window.L&&map instanceof L.Map))map.on('styledata',()=>{if(lookOn&&!map.getSource('cone'))drawWedge()})}
 center();locate();poll();document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(pollT);else poll()});window.addEventListener('online',poll);
 if(map&&map.on)map.on('moveend',()=>{clearTimeout(pollT);pollT=setTimeout(poll,400)})})();
function askId(){return selected||askMmsi||null}
function syncAskMeta(){const id=askId(),s=id&&ships[id];syncAskChip();$('askSel').textContent=id?'About: '+(s&&s.name||('MMSI '+id)):'Ask about ships on the map';
 $('askQ').placeholder=s&&s.name?('Ask about '+s.name+'…'):id?'Ask about this ship…':"What's that ship?"}
function openAsk(mmsi){startCompass();askMmsi=mmsi||selected||null;syncAskMeta();document.body.classList.add('ask-open');$('askPanel').classList.add('open');layoutAsk();$('askQ').focus()}
function closeAsk(){document.body.classList.remove('ask-open');$('askPanel').classList.remove('open');layoutAsk()}
// Mobile Ask mode (<768px): chip = collapsed card; visualViewport keeps the sticky input above the keyboard.
function syncAskChip(){const id=askId(),s=id&&ships[id],c=$('askChip');c.classList.toggle('on',!!id);if(!id)return;
 $('askChipName').textContent=s&&s.name||('MMSI '+id);$('askChipIcon').src=$('sIcon').getAttribute('src')||'/assets/ship-types/unknown.svg'}
function fitViewport(){const v=window.visualViewport,r=document.documentElement.style;if(!v){r.removeProperty('--vvh');r.removeProperty('--vvt');return}
 r.setProperty('--vvh',v.height+'px');r.setProperty('--vvt',v.offsetTop+'px');const l=$('askLog');if(document.body.classList.contains('ask-open')&&l.lastChild)l.scrollTop=l.scrollHeight}
if(window.visualViewport){visualViewport.addEventListener('resize',fitViewport);visualViewport.addEventListener('scroll',fitViewport)}fitViewport();
$('askChip').onclick=()=>{const id=askId();closeAsk();if(id&&ships[id]&&id!==selected)openCard(id)};
$('askBtn').onclick=()=>openAsk(selected);$('askAbout').onclick=()=>openAsk(selected);$('askX').onclick=closeAsk;
addEventListener('resize',layoutAsk);
function viewBox(){try{if(map.getBounds){const b=map.getBounds();return{n:b.getNorth(),s:b.getSouth(),e:b.getEast(),w:b.getWest()}}}catch{}return undefined}
function askBubble(cls,text){const n=document.createElement('div');n.className=cls;if(text!=null)n.textContent=text;$('askLog').appendChild(n);n.scrollIntoView({block:'end'});return n}
$('askForm').onsubmit=async e=>{e.preventDefault();const q=$('askQ').value.trim();if(!q)return;const go=$('askGo');go.disabled=true;
 const id=askId();syncAskMeta();askBubble('me',q);$('askQ').value='';const think=askBubble('ans wait','Thinking…');
 const body={q};if(id)body.mmsi=+id;const v=map&&viewBox();if(v)body.view=v;if(here){body.lat=here.lat;body.lon=here.lon;if(compass!=null)body.heading=compass}
 try{const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json','X-Viewer':VID},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));
  if(r.ok){think.classList.remove('wait');think.textContent=d.answer;const c=document.createElement('span');c.className='conf '+d.confidence;c.textContent=d.confidence+' confidence';think.appendChild(c);
   if(d.mmsi&&ships[d.mmsi]&&d.mmsi!==selected){const b=document.createElement('button');b.type='button';b.className='askShow';b.textContent='Show ship';b.onclick=()=>openCard(d.mmsi);think.appendChild(b)}
   think.scrollIntoView({block:'end'})}
  else{const msg=r.status===429?'Too many questions — try again in a few minutes.':r.status===503?'Ask is not set up on this server yet.':r.status===502?(d.error||'Muse had a problem. Try again.'):(d.error||'Could not ask right now.');
   think.className='err';think.textContent=msg}}
 catch{think.className='err';think.textContent='Offline — could not reach Harbor Muse.'}finally{go.disabled=false}};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

let tmBusy=null;
function syncTellMore(){const b=$('tellMore'),s=selected&&ships[selected],ok=!!(s&&s.mmsi&&s.name);b.disabled=!ok||tmBusy===selected;b.textContent=tmBusy===selected?'Looking up…':'Tell me more';b.title=ok?'':'Needs a ship name and MMSI'}
$('tellMore').onclick=async()=>{const s=selected&&ships[selected];if(!s||!s.mmsi||!s.name||tmBusy)return;tmBusy=s.mmsi;syncTellMore();openAsk(s.mmsi);
 askBubble('me','Tell me more about '+s.name);const think=askBubble('ans wait','Looking up…');const body={mmsi:+s.mmsi,name:String(s.name).slice(0,60)};if(s.imo&&/^\d{7}$/.test(String(s.imo)))body.imo=String(s.imo);
 try{const r=await fetch('/tell-more',{method:'POST',headers:{'Content-Type':'application/json','X-Viewer':VID},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));
  if(r.ok&&d.answer){think.classList.remove('wait');think.textContent=d.answer;
   if(Array.isArray(d.sources)&&d.sources.length){const p=document.createElement('span');p.className='src';p.append('Sources: ');d.sources.slice(0,3).forEach((x,i)=>{if(!/^https?:\/\//.test(x.url))return;if(i)p.append(' · ');const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent=x.title||x.url;p.appendChild(a)});think.appendChild(p)}
   think.scrollIntoView({block:'end'})}
  else{think.className='err';think.textContent=r.status===429?'Too many questions — try again in a few minutes.':r.status===503?'Tell me more is not set up on this server yet.':(d.error||'Muse had a problem. Try again.')}
 }catch{think.className='err';think.textContent='Could not reach the server.'}
 finally{tmBusy=null;syncTellMore()}};
